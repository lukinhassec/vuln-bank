trigger: none
pool:
  vmImage: 'ubuntu-latest'
variables:
  VULN_BANK_PORT: 5000
jobs:
  - job: VulnBankLab
    displayName: 'Vuln Bank + Horusec SAST + ZAP DAST Autenticado'
    timeoutInMinutes: 59
    steps:

    - script: |
        curl -fsSL https://raw.githubusercontent.com/ZupIT/horusec/main/deployments/scripts/install.sh | bash -s latest-beta
      displayName: 'Instalar Horusec'

    - script: |
        mkdir -p $(Build.ArtifactStagingDirectory)/horusec-output
        horusec start -p . \
          -o json \
          -O $(Build.ArtifactStagingDirectory)/horusec-output/horusec-report.json \
          --disable-docker=false \
          --ignore-severity="INFO" \
          -e true
      displayName: 'Horusec SAST Scan'
      continueOnError: true

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/horusec-output'
        ArtifactName: 'horusec-reports'
        publishLocation: 'Container'
      displayName: 'Publicar relatório Horusec'
      condition: always()

    - script: |
        docker compose up -d --build
        echo "Aguardando Vuln Bank inicializar..."
        sleep 45
        curl -sf http://localhost:$(VULN_BANK_PORT) > /dev/null && echo "Vuln Bank UP" || exit 1
      displayName: 'Subir Vuln Bank'

    - script: |
        echo "Registrando usuário..."
        curl -s -X POST http://localhost:$(VULN_BANK_PORT)/register \
          -H "Content-Type: application/json" \
          -d '{"username":"zapuser_pipeline","password":"ZapP@ss123"}' || true

        echo "Fazendo login e extraindo token..."
        TOKEN=$(curl -s -X POST http://localhost:$(VULN_BANK_PORT)/login \
          -H "Content-Type: application/json" \
          -d '{"username":"zapuser_pipeline","password":"ZapP@ss123"}' \
          | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")

        if [ -z "$TOKEN" ]; then
          echo "##[error]Falha ao extrair token JWT"
          exit 1
        fi

        echo "Token extraído (length=${#TOKEN})"
        echo "##vso[task.setvariable variable=ZAP_AUTH_TOKEN;issecret=true]$TOKEN"
      displayName: 'Criar usuário ZAP e extrair token'

    - script: |
        ZAP_WRK=$(Build.ArtifactStagingDirectory)/zap-output
        mkdir -p $ZAP_WRK
        chmod 777 $ZAP_WRK

        TOKEN="$(ZAP_AUTH_TOKEN)"

        # HTTP Sender script: injeta Authorization Bearer em TODA request do ZAP
        cat > $ZAP_WRK/add-bearer-token.js << JSEOF
        function sendingRequest(msg, initiator, helper) {
            var TOKEN = "${TOKEN}";
            if (TOKEN && TOKEN.length > 0) {
                msg.getRequestHeader().setHeader("Authorization", "Bearer " + TOKEN);
            }
        }

        function responseReceived(msg, initiator, helper) {
        }
        JSEOF

        # Plano de automação ZAP
        cat > $ZAP_WRK/zap-plan.yaml << 'YAMLEOF'
        env:
          contexts:
            - name: "vulnbank"
              urls:
                - "http://localhost:5000"
                - "http://localhost:5000/api/login"
                - "http://localhost:5000/api/check_balance"
                - "http://localhost:5000/api/transfer"
              includePaths:
                - "http://localhost:5000.*"
          parameters:
            failOnError: false
            progressToStdout: true
        jobs:
          - type: script
            parameters:
              action: "add"
              type: "httpsender"
              engine: "ECMAScript : Graal.js"
              name: "add-bearer-token"
              source: "/zap/wrk/add-bearer-token.js"
          - type: script
            parameters:
              action: "enable"
              name: "add-bearer-token"
          - type: spider
            parameters:
              context: "vulnbank"
              maxDuration: 5
          - type: activeScan
            parameters:
              context: "vulnbank"
              maxScanDurationInMins: 30
          - type: report
            parameters:
              template: "traditional-html"
              reportDir: "/zap/wrk"
              reportFile: "zap-report.html"
          - type: report
            parameters:
              template: "traditional-json"
              reportDir: "/zap/wrk"
              reportFile: "zap-report.json"
        YAMLEOF

        echo "===== zap-plan.yaml ====="
        cat $ZAP_WRK/zap-plan.yaml
        echo "===== add-bearer-token.js criado ====="
        ls -la $ZAP_WRK/add-bearer-token.js
      displayName: 'Prep diretório ZAP e gerar config'

    - script: |
        docker run --rm \
          --network host \
          -v $(Build.ArtifactStagingDirectory)/zap-output:/zap/wrk:rw \
          ghcr.io/zaproxy/zaproxy:stable \
          zap.sh -cmd -autorun /zap/wrk/zap-plan.yaml
      displayName: 'ZAP Full Scan Autenticado'
      continueOnError: true

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/zap-output'
        ArtifactName: 'zap-reports'
        publishLocation: 'Container'
      displayName: 'Publicar relatório ZAP'
      condition: always()