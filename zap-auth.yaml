env:
  contexts:
    - name: "vulnbank"
      urls:
        - "http://localhost:5000"
      includePaths:
        - "http://localhost:5000.*"
      authentication:
        method: "json"
        parameters:
          loginRequestUrl: "http://localhost:5000/login"
          loginRequestBody: '{"username":"{%username%}","password":"{%password%}"}'
        verification:
          method: "response"
          loggedInRegex: "token"
          loggedOutRegex: "invalid|unauthorized|401"
      sessionManagement:
        method: "httpAuthSessionManagement"  # fallback genérico
      users:
        - name: "testuser"
          credentials:
            username: "zapuser_pipeline"
            password: "ZapP@ss123"
  parameters:
    failOnError: false
    progressToStdout: true

jobs:
  - type: spider
    parameters:
      context: "vulnbank"
      user: "testuser"
      maxDuration: 5
  - type: activeScan
    parameters:
      context: "vulnbank"
      user: "testuser"
      maxDuration: 30
  - type: report
    parameters:
      template: "traditional-html"
      reportDir: "/zap/wrk"
      reportFile: "zap-report.html"
  - type: report
    parameters:
      template: "traditional-json"
      reportDir: "/zap/wrk"
      reportFile: "zap-report.json"
